<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商店服務管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <!-- 頂部導覽列 -->
  <nav class="bg-white shadow-sm border-b border-slate-200 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-bold text-indigo-600">🛍️ 商店服務系統</span>
    </div>
    <div id="user-info" class="hidden items-center space-x-4">
      <img id="user-photo" src="" alt="頭像" class="w-8 h-8 rounded-full border border-slate-300" />
      <span id="user-name" class="text-sm font-medium text-slate-700"></span>
      <button id="logout-btn" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition">
        登出
      </button>
    </div>
  </nav>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto p-6">

    <!-- 1. 登入畫面（未登入時顯示） -->
    <section id="login-section" class="mt-16 bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center max-w-md mx-auto">
      <h1 class="text-2xl font-bold mb-2">歡迎使用商店服務系統</h1>
      <p class="text-slate-500 text-sm mb-6">所有資料均即時儲存於 Google 雲端，跨裝置同步</p>
      <button id="login-btn" class="w-full flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition shadow-sm">
        <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
        </svg>
        <span>使用 Google 帳號登入</span>
      </button>
    </section>

    <!-- 2. 商店服務管理面板（登入後顯示） -->
    <section id="app-section" class="hidden space-y-6">
      
      <!-- 新增服務／項目表單 -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4">新增商店服務 / 商品項目</h2>
        <form id="service-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input type="text" id="item-name" placeholder="服務或商品名稱（例：基本保養）" required
            class="border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <input type="number" id="item-price" placeholder="價格 (HKD)" required min="0"
            class="border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition">
            + 儲存至雲端
          </button>
        </form>
      </div>

      <!-- 雲端資料即時列表 -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">目前服務清單（雲端即時同步）</h2>
          <span id="item-count" class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-full">0 項</span>
        </div>
        <div id="service-list" class="divide-y divide-slate-100">
          <p class="text-slate-400 text-sm py-4 text-center">載入中...</p>
        </div>
      </div>

    </section>

  </main>

  <!-- Firebase Modular SDK (v11) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged,
      setPersistence,
      inMemoryPersistence
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // 你的 Firebase 專案設定
    const firebaseConfig = {
      apiKey: "AIzaSyCOPDC5H7NSmbxzTy9pxbzqxnMo5uM_TME",
      authDomain: "sign-in-f24d3.firebaseapp.com",
      projectId: "sign-in-f24d3",
      storageBucket: "sign-in-f24d3.firebasestorage.app",
      messagingSenderId: "421828610300",
      appId: "1:421828610300:web:6eafca251a19e3824fef79"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // 強制使用記憶體狀態，完全唔寫入 localStorage / IndexedDB
    setPersistence(auth, inMemoryPersistence);

    // DOM 元素
    const loginSection = document.getElementById("login-section");
    const appSection = document.getElementById("app-section");
    const userInfo = document.getElementById("user-info");
    const userPhoto = document.getElementById("user-photo");
    const userName = document.getElementById("user-name");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const serviceForm = document.getElementById("service-form");
    const serviceList = document.getElementById("service-list");
    const itemCount = document.getElementById("item-count");

    let unsubscribeFirestore = null;

    // Google 登入事件
    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        alert("登入失敗：" + error.message);
      }
    });

    // 登出事件
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // 已登入
        loginSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        userInfo.classList.remove("hidden");
        userInfo.classList.add("flex");
        userPhoto.src = user.photoURL || "";
        userName.textContent = user.displayName || user.email;

        // 啟動 Firestore 雲端即時監聽
        listenToServices();
      } else {
        // 未登入
        loginSection.classList.remove("hidden");
        appSection.classList.add("hidden");
        userInfo.classList.add("hidden");
        userInfo.classList.remove("flex");
        if (unsubscribeFirestore) unsubscribeFirestore();
      }
    });

    // 新增資料到 Firestore
    serviceForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameInput = document.getElementById("item-name");
      const priceInput = document.getElementById("item-price");

      try {
        await addDoc(collection(db, "store_services"), {
          name: nameInput.value.trim(),
          price: Number(priceInput.value),
          createdBy: auth.currentUser.email,
          createdAt: serverTimestamp()
        });
        nameInput.value = "";
        priceInput.value = "";
      } catch (error) {
        alert("儲存失敗，請檢查 Firestore 權限設定：" + error.message);
      }
    });

    // 即時讀取 Firestore 資料
    function listenToServices() {
      const q = query(collection(db, "store_services"), orderBy("createdAt", "desc"));
      unsubscribeFirestore = onSnapshot(q, (snapshot) => {
        serviceList.innerHTML = "";
        itemCount.textContent = `${snapshot.size} 項`;

        if (snapshot.empty) {
          serviceList.innerHTML = `<p class="text-slate-400 text-sm py-6 text-center">暫時未有任何服務項目，請在上方新增。</p>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const row = document.createElement("div");
          row.className = "py-3.5 flex justify-between items-center";
          row.innerHTML = `
            <div>
              <p class="font-medium text-slate-800">${escapeHTML(data.name)}</p>
              <p class="text-xs text-slate-400">建立者：${escapeHTML(data.createdBy || "未知")}</p>
            </div>
            <div class="flex items-center space-x-4">
              <span class="font-semibold text-indigo-600">HK$ ${data.price}</span>
              <button data-id="${docSnap.id}" class="delete-btn text-xs text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-lg transition">
                刪除
              </button>
            </div>
          `;
          serviceList.appendChild(row);
        });

        // 綁定刪除按鈕
        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-id");
            await deleteDoc(doc(db, "store_services", id));
          });
        });
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }
  </script>
</body>
</html>
